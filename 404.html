<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<style>
  :root { --fundo: #f6f3ea; --texto: #1c2a22; --suave: #4d5e53; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0f1a13; --texto: #e9f0ea; --suave: #a9bbae; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--fundo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; line-height: 1.6; }
  img { width: 150px; height: 150px; margin: 0 auto 10px; }
  h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); }
  p { margin: 10px 0 0; color: var(--suave); }
  a.botao { display: inline-block; margin-top: 22px; padding: 13px 26px; border-radius: 999px; background: #e8a33d; color: #1b2a1f; font-weight: 700; text-decoration: none; }
  a.botao:hover { background: #f0b255; }
  :focus-visible { outline: 3px solid #e8a33d; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <picture><source srcset="/logo.webp" type="image/webp"><img src="/logo.png" width="150" height="150" alt="Logo do Brote na Trilha"></picture>
  <h1>Essa trilha não existe</h1>
  <p>A página que você procura não foi encontrada. Talvez o endereço tenha mudado.</p>
  <a class="botao" href="/">Voltar ao início</a>
</main>
</body>
</html>

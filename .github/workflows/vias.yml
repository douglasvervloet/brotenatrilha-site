# Atualiza todo mês os dados do Brasil que a ferramenta "Planejar pedal" lê do R2 da Cloudflare (bucket brotenatrilha-dados,
# servido em dados.brotenatrilha.com.br/br/): as vias (br/vias/, o terreno e o piso das ruas), os pontos de apoio (br/apoios/),
# os pontos de interesse (br/interesses/, com as fotos em br/fotos/), as ciclovias (br/ciclovias/) e os avisos na rota (br/avisos/:
# porteira, vau, balsa, escada). Baixa o mapa do Brasil na Geofabrik (uns 2 GB) e roda os
# geradores de ferramentas/ (gerar_vias.py, gerar_apoios.py, gerar_interesses.py, gerar_ciclovias.py, gerar_avisos.py). Nada vai para o repositório.
# Os pontos de interesse guardam no R2 um cache das fotos e textos da Wikipédia (br/_cache_interesses_v2.json): só os novos são
# consultados, e só as fotos novas são baixadas e enviadas (as antigas ficam em br/fotos/).
# Segredos: R2_ACCESS_KEY_ID e R2_SECRET_ACCESS_KEY. Pode ser rodado na mão em "Actions".
name: Atualizar os dados do mapa (Brasil)

on:
  schedule:
    - cron: "0 6 3 * *"   # dia 3 de cada mês às 06:00 UTC (3:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vias
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required      # o aws novo manda uma checagem que o R2 não aceita
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_RETRY_MODE: adaptive        # o R2 responde SlowDown com muitos envios seguidos: tenta de novo, esperando cada vez mais
  AWS_MAX_ATTEMPTS: "10"
  R2: https://a31fab7247d8f39a21d0f52f1261a8d1.r2.cloudflarestorage.com
  BUCKET: s3://brotenatrilha-dados/br
  LIMITE_DE_CONSULTAS: 3000      # consultas novas à Wikipédia por rodada (cada uma também baixa a foto)

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Conferir os segredos do R2
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::error::Sem R2_ACCESS_KEY_ID nos segredos: os dados não podem ser publicados."; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar osmium (lê o mapa) e Pillow (o gerador de vias importa o código dos pedais)
        run: pip install osmium pillow

      - name: Baixar o mapa do Brasil (Geofabrik)
        run: |
          curl -fL --retry 3 --retry-delay 20 -o "$RUNNER_TEMP/brasil.osm.pbf" https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
          ls -lh "$RUNNER_TEMP/brasil.osm.pbf"

      - name: Gerar as vias (terreno e piso das ruas)
        run: |
          python ferramentas/gerar_vias.py "$RUNNER_TEMP/brasil.osm.pbf" "$RUNNER_TEMP/br/vias"
          # um mapa quebrado não pode apagar as vias do R2
          n=$(ls "$RUNNER_TEMP/br/vias" | wc -l)
          if [ "$n" -lt 30000 ]; then echo "::error::Só $n arquivos de vias: algo deu errado, nada foi enviado."; exit 1; fi

      - name: Gerar os pontos de apoio (água, mercado, posto, lanchonete, bike, banheiro)
        run: |
          python ferramentas/gerar_apoios.py "$RUNNER_TEMP/brasil.osm.pbf" "$RUNNER_TEMP/br/apoios"
          python ferramentas/contar_quadrados.py "$RUNNER_TEMP/br/apoios" p 50000

      - name: Gerar os pontos de interesse (com foto da Wikipédia, pelo cache)
        run: |
          aws s3 cp "$BUCKET/_cache_interesses_v2.json" "$RUNNER_TEMP/cache_interesses.json" --endpoint-url "$R2" --only-show-errors || echo "Sem cache ainda: todas as consultas são novas."
          python ferramentas/gerar_interesses.py "$RUNNER_TEMP/brasil.osm.pbf" "$RUNNER_TEMP/br/interesses" "$RUNNER_TEMP/cache_interesses.json"
          python ferramentas/contar_quadrados.py "$RUNNER_TEMP/br/interesses" p 5000

      - name: Gerar as ciclovias (camada Ciclovias)
        run: |
          python ferramentas/gerar_ciclovias.py "$RUNNER_TEMP/brasil.osm.pbf" "$RUNNER_TEMP/br/ciclovias"
          python ferramentas/contar_quadrados.py "$RUNNER_TEMP/br/ciclovias" c 3000

      - name: Gerar os avisos na rota (porteira, vau, balsa, escada)
        run: |
          python ferramentas/gerar_avisos.py "$RUNNER_TEMP/brasil.osm.pbf" "$RUNNER_TEMP/br/avisos"
          python ferramentas/contar_quadrados.py "$RUNNER_TEMP/br/avisos" p 2000

      - name: Enviar ao R2 (dados.brotenatrilha.com.br/br/)
        run: |
          aws configure set default.s3.max_concurrent_requests 4      # 4 envios de cada vez (o padrão, 10, estourava o limite do R2)
          envia() {
            aws s3 sync "$RUNNER_TEMP/br/$1" "$BUCKET/$1" --delete --size-only --only-show-errors --endpoint-url "$R2" \
              --content-type application/json --cache-control "public, max-age=86400"
            echo "$1: $(ls "$RUNNER_TEMP/br/$1" | wc -l) arquivos"
          }
          # as pastas pequenas primeiro; as vias (160 mil arquivos) por último
          for pasta in apoios interesses ciclovias avisos; do envia $pasta; done
          # as fotos: só as novas desta rodada (sem --delete: as antigas continuam no R2); o nome muda se o arquivo da foto mudar
          aws s3 sync "$RUNNER_TEMP/br/fotos" "$BUCKET/fotos" --size-only --only-show-errors --endpoint-url "$R2" \
            --cache-control "public, max-age=2592000"
          echo "fotos novas: $(ls "$RUNNER_TEMP/br/fotos" | wc -l)"
          aws s3 cp "$RUNNER_TEMP/cache_interesses.json" "$BUCKET/_cache_interesses_v2.json" --endpoint-url "$R2" --only-show-errors \
            --content-type application/json
          envia vias

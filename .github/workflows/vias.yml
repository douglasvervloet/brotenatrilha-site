# Atualiza todo mês os arquivos do Espírito Santo que a ferramenta "Planejar pedal" lê: as vias (ferramentas/vias/, para o terreno: asfalto, terra,
# calçamento, sem depender do Overpass) os pontos de apoio (ferramentas/apoios/) os pontos de interesse (ferramentas/interesses/) e as ciclovias (ferramentas/ciclovias/). Baixa o mapa do Sudeste na Geofabrik (uns 900 MB), roda ferramentas/gerar_vias.py
# e grava só se algo mudou. Não usa segredos. Pode ser rodado na mão em "Actions".
name: Atualizar vias e pontos de apoio do Espírito Santo

on:
  schedule:
    - cron: "0 6 3 * *"   # dia 3 de cada mês às 06:00 UTC (3:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vias
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar osmium (lê o mapa) e Pillow (o gerador importa o código dos pedais)
        run: pip install osmium pillow

      - name: Baixar o mapa do Sudeste (Geofabrik)
        run: curl -fL --retry 3 --retry-delay 20 -o "$RUNNER_TEMP/sudeste.osm.pbf" https://download.geofabrik.de/south-america/brazil/sudeste-latest.osm.pbf

      - name: Gerar os arquivos de vias
        run: |
          python ferramentas/gerar_vias.py "$RUNNER_TEMP/sudeste.osm.pbf" ferramentas/vias
          # um mapa quebrado não pode apagar as vias do site: o estado inteiro dá uns 2.800 arquivos
          n=$(ls ferramentas/vias | wc -l)
          if [ "$n" -lt 2000 ]; then echo "::error::Só $n arquivos de vias: algo deu errado, nada foi gravado."; exit 1; fi

      - name: Gerar os pontos de apoio (água, mercado, posto, lanchonete, bike, banheiro)
        run: |
          python ferramentas/gerar_apoios.py "$RUNNER_TEMP/sudeste.osm.pbf" ferramentas/apoios
          n=$(python -c "import json; print(len(json.load(open('ferramentas/apoios/apoios.json', encoding='utf-8'))['p']))")
          if [ "$n" -lt 2000 ]; then echo "::error::Só $n pontos de apoio: algo deu errado, nada foi gravado."; exit 1; fi

      - name: Gerar os pontos de interesse (com foto da Wikipédia)
        run: |
          python ferramentas/gerar_interesses.py "$RUNNER_TEMP/sudeste.osm.pbf" ferramentas/interesses
          n=$(python -c "import json; print(len(json.load(open('ferramentas/interesses/interesses.json', encoding='utf-8'))['p']))")
          if [ "$n" -lt 300 ]; then echo "::error::Só $n pontos de interesse: algo deu errado, nada foi gravado."; exit 1; fi

      - name: Gerar as ciclovias (camada Ciclovias do Planejar pedal)
        run: |
          python ferramentas/gerar_ciclovias.py "$RUNNER_TEMP/sudeste.osm.pbf" ferramentas/ciclovias
          n=$(python -c "import json; print(len(json.load(open('ferramentas/ciclovias/ciclovias.json', encoding='utf-8'))['c']))")
          if [ "$n" -lt 400 ]; then echo "::error::Só $n trechos de ciclovia: algo deu errado, nada foi gravado."; exit 1; fi

      - name: Gravar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ferramentas/vias ferramentas/apoios ferramentas/interesses ferramentas/ciclovias
          git diff --cached --quiet || (git commit -m "Atualiza as vias do Espírito Santo" && git pull --rebase origin main && git push)

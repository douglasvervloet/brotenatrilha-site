# Busca os números do canal no YouTube uma vez por dia e grava em estatisticas.json, que a página lê.
# Precisa do segredo YOUTUBE_API_KEY (chave de API do Google, restrita à YouTube Data API v3).
name: Atualizar números do canal

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:        # também dá para rodar na mão, na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar os números no YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_API_KEY:-}" ]; then echo "Segredo YOUTUBE_API_KEY ainda não cadastrado: nada a fazer."; exit 0; fi
          resposta=$(curl -fsS "https://www.googleapis.com/youtube/v3/channels?part=statistics&id=UC2uS9f0ACz0LZC7HwZWVBPQ&key=${YOUTUBE_API_KEY}")
          echo "$resposta" | jq '{
            inscritos: ((.items[0].statistics.subscriberCount // "0") | tonumber),
            visualizacoes: ((.items[0].statistics.viewCount // "0") | tonumber),
            videos: ((.items[0].statistics.videoCount // "0") | tonumber),
            atualizado: (now | strftime("%Y-%m-%d"))
          }' > estatisticas.json
          cat estatisticas.json

      - name: Gravar se mudou
        run: |
          [ -f estatisticas.json ] || { echo "Sem estatisticas.json: nada a gravar."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estatisticas.json
          git diff --cached --quiet || (git commit -m "Atualiza os números do canal" && git push)

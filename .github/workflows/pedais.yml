# Atualiza as páginas de pedais todos os dias: busca os pedais no Strava, casa com os vídeos do canal e grava pedais/index.html,
# uma página por pedal, o bloco 'Último pedal' do index.html e o sitemap.xml.
# Por padrão lê no Strava só as atividades novas (e as dos últimos 7 dias): o resto vem de ferramentas/cache_pedais.json, que
# não guarda traçado bruto nem coordenadas. Aos domingos, ou rodando na mão com "completo" marcado, lê tudo de novo.
# Segredos usados: CASA_COORD (coordenada de casa, fora do repositório público), STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_REFRESH_TOKEN (criados por ferramentas/strava_autorizar.ps1)
# e YOUTUBE_API_KEY. Opcional: GH_PAT_SEGREDOS, um token do GitHub só com permissão de escrever segredos deste repositório,
# para guardar o refresh token novo caso o Strava o troque (sem ele, o robô avisa e o token precisa ser refeito).
name: Atualizar página de pedais

on:
  schedule:
    - cron: "30 11 * * 1-6"  # segunda a sábado às 11:30 UTC (8:30 em Brasília)
    - cron: "30 11 * * 0"   # domingo às 11:30 UTC (8:30 em Brasília: o vídeo sai às 8h); aos domingos a leitura é completa
  workflow_dispatch:
    inputs:
      completo:
        description: "Ler todas as atividades do Strava de novo (em vez de só as novas)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o Pillow (monta as imagens dos mapas)
        run: pip install pillow

      - name: Gerar a página
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CASA_COORD: ${{ secrets.CASA_COORD }}   # "lat,lon" de casa; só pedais que saem/chegam a 500 m dela têm começo e fim cortados
          NOVO_REFRESH_ARQUIVO: ${{ runner.temp }}/novo_refresh.txt
          ORCAMENTO_LUGARES: "2500"   # consultas ao OpenStreetMap por rodada (1 por segundo); pedal novo gasta uns 75
        run: |
          # aos domingos (e quando pedido na mão) lê tudo de novo: pega atividades apagadas, editadas ou enviadas muito depois
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event.inputs.completo }}" = "true" ]; then export COMPLETO=1; fi
          python ferramentas/gerar_pedais.py --home index.html --sitemap sitemap.xml

      - name: Guardar o refresh token novo do Strava (se mudou)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SEGREDOS }}
          NOVO: ${{ runner.temp }}/novo_refresh.txt
        run: |
          if [ -s "$NOVO" ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set STRAVA_REFRESH_TOKEN --repo "${{ github.repository }}" < "$NOVO"
              echo "Refresh token do Strava atualizado."
            else
              echo "::warning::O Strava trocou o refresh token e não há GH_PAT_SEGREDOS para guardar o novo. Rode ferramentas/strava_autorizar.ps1 de novo."
            fi
          fi

      - name: Gravar se mudou
        run: |
          [ -f pedais/index.html ] || { echo "Sem pedais/index.html: nada a gravar."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pedais index.html sitemap.xml ferramentas/cache_lugares.json ferramentas/cache_clima.json ferramentas/cache_pedais.json
          git diff --cached --quiet || (git commit -m "Atualiza a página de pedais e os mapas" && git pull --rebase origin main && git push)
